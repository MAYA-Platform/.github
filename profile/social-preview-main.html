<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAYA Platform - Context before response. Permission before action.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0a0805 0%, #1a1410 50%, #0f1419 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Eclipse background image overlay */
        .eclipse-bg {
            position: absolute;
            top: 0;
            right: -100px;
            width: 600px;
            height: 630px;
            background: radial-gradient(circle at 50% 30%, rgba(255, 200, 100, 0.15) 0%, rgba(255, 100, 50, 0.08) 20%, rgba(0, 0, 0, 0) 50%),
                        radial-gradient(circle at 50% 50%, rgba(10, 10, 15, 0.4) 0%, rgba(0, 0, 0, 0.8) 100%);
            box-shadow: inset -200px 0 300px rgba(0, 0, 0, 0.9);
            opacity: 0.85;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 60px 80px;
            max-width: 650px;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
        }

        .orb {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff8e8 0%, #f0c060 22%, #f0a030 48%, #7d531c 78%, #3a2a12 100%);
            box-shadow: 0 0 24px rgba(240, 160, 48, 0.5), inset 0 0 12px rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #f2e6df;
            line-height: 1.1;
            margin: 0;
        }

        .gold {
            color: #e6a817;
        }

        .tagline {
            font-size: 20px;
            color: #8a827c;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin: 12px 0 0 0;
            line-height: 1.3;
            max-width: 520px;
        }

        .features {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 24px;
            width: 100%;
        }

        .feature-badge {
            background: rgba(230, 168, 23, 0.15);
            border: 1px solid rgba(230, 168, 23, 0.35);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 12px;
            color: #e6a817;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
        }

        .cta {
            background: #f0a030;
            color: #0a0805;
            border: none;
            border-radius: 10px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            letter-spacing: -0.01em;
            transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(240, 160, 48, 0.3);
        }

        .cta:hover {
            filter: brightness(1.12);
            box-shadow: 0 12px 32px rgba(240, 160, 48, 0.4);
        }

        /* Right side accent line */
        .accent-line {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, #f0a030, #e6a817, transparent);
        }

        footer {
            position: absolute;
            bottom: 24px;
            left: 80px;
            font-size: 11px;
            color: #8a827c;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="eclipse-bg"></div>
    <div class="accent-line"></div>

    <div class="container">
        <div class="content">
            <div class="orb"></div>
            
            <h1>MAYA<br><span class="gold">Platform</span></h1>
            
            <p class="tagline">Context before response.<br>Permission before action.</p>

            <div class="features">
                <span class="feature-badge">Local-First</span>
                <span class="feature-badge">Permissioned</span>
                <span class="feature-badge">Trustable AI</span>
            </div>

            <button class="cta">Explore on GitHub</button>
        </div>
    </div>

    <footer>2ndNatureAi</footer>
</body>
</html>
